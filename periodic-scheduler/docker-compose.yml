services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: scheduler
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?CHANGE_ME}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Two scheduler processes sharing one database. Both run planner/dispatcher
  # ticks; the single-lease guarantee is enforced by PostgreSQL.
  node-1: &node
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DATABASE_URL: jdbc:postgresql://postgres:5432/scheduler
      DATABASE_USER: scheduler
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?CHANGE_ME}
      APP_NODE_ID: node-1
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  node-2:
    <<: *node
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DATABASE_URL: jdbc:postgresql://postgres:5432/scheduler
      DATABASE_USER: scheduler
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?CHANGE_ME}
      APP_NODE_ID: node-2
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
